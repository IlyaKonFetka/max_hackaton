# Обязательные требования — Роструд (трудовое законодательство и охрана труда).
# Проверочные листы: приказ Роструда от 01.02.2022 № 20 (ред. от 09.12.2024), 80 форм; номера приложений
# сверены с оглавлением документа 26.09.2026. Какие из 80 форм относятся к заведению, описано в checklists.yaml. Статьи ТК РФ — в нумерации раздела X «Охрана труда»,
# действующей с 01.03.2022 (ст. 214 — обязанности работодателя, 219 — обучение, 220 — медосмотры,
# 221 — СИЗ, 223 — служба охраны труда). Номера контрольных вопросов внутри листов не сверены.

agency: rostrud
agency_label: "Роструд"
order: 2
version: "2026-09-26"
section: "Трудовые отношения"
items:

  - id: rt-contracts
    title: "Со всеми работниками заключены письменные трудовые договоры"
    check: "Договор подписан обеими сторонами не позднее 3 рабочих дней с начала работы; экземпляр у работника под роспись."
    source:
      doc: "ТК РФ"
      clause: "ст. 67"
      checklist: "Приказ Роструда № 20, приложения 1 «Оформление приёма на работу» и 2 «Содержание трудовых договоров»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: high
    fix_days: 7

  - id: rt-local-acts
    title: "Работники ознакомлены под роспись с правилами внутреннего трудового распорядка и локальными актами"
    check: "Есть ПВТР, листы ознакомления подписаны до подписания трудового договора."
    source:
      doc: "ТК РФ"
      clause: "ст. 68, ст. 189"
      checklist: "Приказ Роструда № 20, приложение 1 «Оформление приёма на работу»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rt-induction
    section: Охрана труда
    title: "Со всеми работниками проведён вводный инструктаж по охране труда"
    check: "Журнал вводного инструктажа с подписями; программа инструктажа утверждена."
    source:
      doc: "ТК РФ; пост. Правительства РФ от 24.12.2021 № 2464"
      clause: "ст. 219 ТК РФ; п. 10–11 Правил обучения по ОТ"
      checklist: "Приказ Роструда № 20, приложение 21 «Обучение по охране труда»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: high
    fix_days: 7

  - id: rt-workplace-briefing
    section: Охрана труда
    title: "Проводятся первичный инструктаж на рабочем месте и повторный — не реже одного раза в 6 месяцев"
    check: "Журнал инструктажей на рабочем месте: даты, подписи инструктируемого и инструктирующего."
    source:
      doc: "Пост. Правительства РФ от 24.12.2021 № 2464"
      clause: "п. 12–16 Правил обучения по ОТ"
      checklist: "Приказ Роструда № 20, приложение 21 «Обучение по охране труда»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: halfyear
    evidence: document
    severity: medium
    fix_days: 14

  - id: rt-medexams
    section: Охрана труда
    title: "Организованы обязательные предварительные и периодические медицинские осмотры работников"
    check: "Направления на предварительный медосмотр при приёме, заключения, график периодических осмотров. Медосмотры оплачивает работодатель."
    source:
      doc: "ТК РФ; приказ Минздрава от 28.01.2021 № 29н"
      clause: "ст. 220 ТК РФ"
      checklist: "Приказ Роструда № 20, приложение 18 «Обязательные предварительные и периодические медицинские осмотры»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: year
    evidence: document
    severity: high
    fix_days: 30

  - id: rt-sout
    section: Охрана труда
    title: "Проведена специальная оценка условий труда на всех рабочих местах"
    check: "Отчёт о СОУТ не старше 5 лет (или декларация соответствия), работники ознакомлены с картами под роспись."
    source:
      doc: "Федеральный закон от 28.12.2013 № 426-ФЗ; ТК РФ"
      clause: "ст. 8, 17 426-ФЗ; ст. 214 ТК РФ"
      checklist: "Приказ Роструда № 20, приложение 19 «Специальная оценка условий труда»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: high
    fix_days: 60

  - id: rt-ppe
    section: Охрана труда
    title: "Работники обеспечены средствами индивидуальной защиты и смывающими средствами по нормам"
    check: "Личные карточки учёта выдачи СИЗ, фактическое наличие спецодежды, перчаток, средств для мытья рук."
    source:
      doc: "ТК РФ; приказ Минтруда от 29.10.2021 № 767н"
      clause: "ст. 221 ТК РФ"
      checklist: "Приказ Роструда № 20, приложение 22 «Приобретение, выдача и применение средств индивидуальной защиты»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
        - { field: has_kitchen, eq: true }
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rt-timesheet
    title: "Ведётся табель учёта рабочего времени; соблюдаются режим работы и продолжительность отдыха"
    check: "Табель за текущий месяц, графики сменности доведены за месяц, переработки учтены и оплачены."
    source:
      doc: "ТК РФ"
      clause: "ст. 91, ст. 103, ст. 108"
      checklist: "Приказ Роструда № 20, приложения 6 «Режим и продолжительность рабочего времени» и 7 «Предоставление времени отдыха»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: month
    evidence: document
    severity: medium
    fix_days: 7

  - id: rt-salary
    title: "Заработная плата выплачивается не реже чем каждые полмесяца; работникам выдаются расчётные листки"
    check: "Даты выплат закреплены в ПВТР/договоре, ведомости за последние два месяца, форма расчётного листка утверждена."
    source:
      doc: "ТК РФ"
      clause: "ст. 136"
      checklist: "Приказ Роструда № 20, приложение 8 «Установление и выплата заработной платы»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: month
    evidence: document
    severity: high
    fix_days: 7

  - id: rt-ot-responsible
    section: Охрана труда
    title: "Назначен работник, ответственный за организацию охраны труда"
    check: "Приказ о назначении ответственного; при численности более 50 человек — служба или специалист по ОТ."
    source:
      doc: "ТК РФ"
      clause: "ст. 223"
      checklist: "Приказ Роструда № 20, приложение 23 «Система управления охраной труда»"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rt-workbooks
    title: "Ведутся трудовые книжки (у тех, кто их сохранил) и подаются сведения о трудовой деятельности в Социальный фонд"
    check: "Книга учёта движения трудовых книжек; записи о приёме внесены; сведения о приёме и увольнении поданы в срок (форма ЕФС-1)."
    source:
      doc: "ТК РФ"
      clause: "ст. 66, ст. 66.1"
      checklist: "Приказ Роструда № 20, приложение 5 «Ведение и хранение трудовых книжек, сведения о трудовой деятельности»"
      as_of: "2026-09-26"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: month
    evidence: document
    severity: medium
    fix_days: 7

  - id: rt-ot-instructions
    section: Охрана труда
    title: "Утверждены инструкции по охране труда для каждой должности и вида работ"
    check: "Инструкции для повара, официанта, бариста, кассира, мойщика посуды и других должностей утверждены и доступны на рабочих местах."
    source:
      doc: "ТК РФ; приказ Минтруда от 29.10.2021 № 772н"
      clause: "ст. 214 ТК РФ; Основные требования к порядку разработки и содержанию правил и инструкций по охране труда"
      checklist: "Приказ Роструда № 20, приложение 77 «Порядок разработки и содержание правил и инструкций по охране труда»"
      as_of: "2026-09-26"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: medium
    fix_days: 30

  - id: rt-accidents
    section: Охрана труда
    title: "Работодатель знает порядок действий при несчастном случае: извещение, комиссия, расследование, учёт"
    check: "Заранее: приказ о порядке расследования, аптечка, контакты для извещений. Если случай произошёл: первая помощь, сохранить обстановку, создать комиссию; лёгкий несчастный случай расследуют в течение 3 календарных дней (ст. 229.1), оформляют акт по форме Н-1 (ст. 230) и регистрируют в журнале. Кого и в какой срок извещать, зависит от тяжести (ст. 228.1)."
    source:
      doc: "ТК РФ"
      clause: "ст. 227–231"
      checklist: "Приказ Роструда № 20, приложение 17 «Организация расследования и учёта несчастных случаев на производстве»"
      as_of: "2026-09-26"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: medium
    fix_days: 30
