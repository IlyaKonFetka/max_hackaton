# Обязательные требования — Роспотребнадзор, розничная торговля продуктами (магазин у дома).
#
# Второй отраслевой справочник: демонстрирует масштабирование движка — код не менялся, добавлен вариант
# профиля activity=shop и этот файл. Требования применяются только к магазинам (applies_if: activity in [shop]).
#
# Сверено 20.09.2026:
#   • СП 2.3.6.3668-20 «Санитарно-эпидемиологические требования к условиям деятельности торговых объектов
#     и рынков, реализующих пищевую продукцию» (пост. Главного государственного санитарного врача от 20.11.2020 № 36,
#     действует до 01.01.2027);
#   • проверочный лист для объектов розничной торговли — приказ Роспотребнадзора от 24.12.2021 № 808,
#     приложение № 1, 176 контрольных вопросов.
# Общие для общепита и торговли требования (уведомление о начале деятельности, медкнижки, алкоголь)
# описаны в rospotrebnadzor.yaml без ограничения по виду деятельности и к магазину тоже применяются.

agency: rospotrebnadzor
agency_label: "Роспотребнадзор"
order: 1
version: "2026-09-20"
domain: "Магазины"
section: "Магазин"
items:

  - id: rt-shop-docs
    title: "Вся продукция поступает и реализуется с товаросопроводительными документами и маркировкой"
    check: "На каждую партию — документы, обеспечивающие прослеживаемость; продукция без маркировки и документов не принимается и не продаётся."
    source:
      doc: "СП 2.3.6.3668-20; ТР ТС 021/2011; ТР ТС 022/2011"
      clause: "п. 7.2, п. 8.11 СП 2.3.6.3668-20; п. 3 ст. 5, ст. 39 ТР ТС 021/2011"
      checklist: "Приказ № 808, прил. № 1, вопросы 63, 108, 114, 120"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: check
    severity: high
    fix_days: 1

  - id: rt-shop-temp
    title: "Холодильное оборудование оснащено термометрами; температура и влажность хранения фиксируются ежедневно"
    check: "Термометры в каждом холодильнике и витрине самообслуживания; запись показаний за сегодня на бумаге или электронно; ртутные термометры не используются."
    source:
      doc: "СП 2.3.6.3668-20; ТР ТС 021/2011"
      clause: "п. 6.2, п. 7.5, п. 8.10 СП 2.3.6.3668-20; п. 12 ст. 17 ТР ТС 021/2011"
      checklist: "Приказ № 808, прил. № 1, вопросы 51–53, 69, 106"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: rt-shop-neighbourhood
    title: "Соблюдается товарное соседство; продукция не касается труб, батарей, стен и пола"
    check: "Сырое мясо и рыба отдельно от готового; хлеб на стеллажах, не у стены; сильно пахнущее — отдельно."
    source:
      doc: "СП 2.3.6.3668-20; ТР ТС 021/2011"
      clause: "п. 7.6, п. 7.7, п. 7.11 СП 2.3.6.3668-20; п. 8 ст. 17 ТР ТС 021/2011"
      checklist: "Приказ № 808, прил. № 1, вопросы 71, 77, 84, 85"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: photo
    severity: medium
    fix_days: 1

  - id: rt-shop-shelf-life
    title: "Соблюдаются сроки годности и условия хранения; ярлыки транспортной упаковки сохраняются до конца реализации"
    check: "Выборочная проверка полок и склада; на развесной продукции доступна информация о сроке и условиях хранения; просроченное снято."
    source:
      doc: "СП 2.3.6.3668-20; ТР ТС 021/2011; ТР ТС 022/2011"
      clause: "п. 7.3 СП 2.3.6.3668-20; п. 9, 13 ст. 17 ТР ТС 021/2011; ч. 4.12 ст. 4 ТР ТС 022/2011"
      checklist: "Приказ № 808, прил. № 1, вопросы 68, 75, 121"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: check
    severity: high
    fix_days: 1

  - id: rt-shop-cutting
    title: "Для подготовки продукции к продаже используются отдельные промаркированные инвентарь, доски и ножи"
    check: "Доски и ножи с маркировкой по видам продукции; фасовка скоропортящегося — в зоне с холодильником; уборщики к фасовке не привлекаются."
    source:
      doc: "СП 2.3.6.3668-20; ТР ТС 021/2011"
      clause: "п. 5.2, п. 8.2, п. 8.3 СП 2.3.6.3668-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 33, 35, 97, 98"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
        - { field: has_kitchen, eq: true }
    period: once
    evidence: photo
    severity: medium
    fix_days: 3

  - id: rt-shop-loose
    title: "Продажа вразвес — при наличии раковин для мытья инвентаря и рук; хлеб и кондитерские — в упакованном виде"
    check: "У прилавка с развесным товаром есть раковина; хлеб не отпускается без упаковки."
    source:
      doc: "СП 2.3.6.3668-20; Федеральный закон от 02.01.2000 № 29-ФЗ"
      clause: "п. 8.6, п. 9.5 СП 2.3.6.3668-20; ч. 3 ст. 20 29-ФЗ"
      checklist: "Приказ № 808, прил. № 1, вопросы 103, 129"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: once
    evidence: check
    severity: medium
    fix_days: 7

  - id: rt-shop-cleaning
    title: "Ежедневная влажная уборка всех помещений; торговый зал — в конце дня; раз в месяц — уборка с дезинфекцией оборудования"
    check: "Уборка за сегодня проведена; график генеральной уборки с отметкой за текущий месяц."
    source:
      doc: "СП 2.3.6.3668-20"
      clause: "п. 10.4, п. 10.5 СП 2.3.6.3668-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 138–141"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: check
    severity: medium
    fix_days: 1

  - id: rt-shop-inventory
    title: "Уборочный инвентарь промаркирован по назначению; инвентарь и одежда для туалета хранятся отдельно"
    check: "Маркировка на вёдрах и швабрах (зал / склад / туалет); отдельное место хранения."
    source:
      doc: "СП 2.3.6.3668-20"
      clause: "п. 10.6 СП 2.3.6.3668-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 142, 143"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: once
    evidence: photo
    severity: low
    fix_days: 3

  - id: rt-shop-disinfectants
    title: "Моющие и дезсредства с документами о регистрации, применяются по инструкции, хранятся в таре изготовителя отдельно от продуктов"
    check: "Свидетельства/декларации на средства; инструкции доступны; отдельное место хранения."
    source:
      doc: "СП 2.3.6.3668-20; СанПиН 3.3686-21"
      clause: "п. 10.7 СП 2.3.6.3668-20; п. 84–85 СанПиН 3.3686-21"
      checklist: "Приказ № 808, прил. № 1, вопросы 144–147"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: month
    evidence: document
    severity: medium
    fix_days: 7

  - id: rt-shop-pest
    title: "В торговом объекте нет насекомых и грызунов; помещения защищены от их проникновения"
    check: "Осмотр; сетки на окнах и вентиляции, уплотнения дверей; договор на дератизацию/дезинсекцию или акты обработок."
    source:
      doc: "СП 2.3.6.3668-20; СП 2.1.3678-20; СанПиН 3.3686-21"
      clause: "п. 10.8 СП 2.3.6.3668-20; п. 2.12 СП 2.1.3678-20; раздел 3 СанПиН 3.3686-21"
      checklist: "Приказ № 808, прил. № 1, вопросы 148, 150"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: month
    evidence: document
    severity: medium
    fix_days: 14

  - id: rt-shop-waste
    title: "Отходы собираются в мусоросборники на площадке с твёрдым покрытием; для пищевых отходов — промаркированные ёмкости"
    check: "Контейнерная площадка чистая, вывоз по договору; ёмкости для пищевых отходов и санитарного брака подписаны; территория убирается ежедневно."
    source:
      doc: "СП 2.3.6.3668-20; СанПиН 2.1.3684-21"
      clause: "п. 10.1–10.3 СП 2.3.6.3668-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 131–137"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: shift
    evidence: check
    severity: medium
    fix_days: 1

  - id: rt-shop-water
    title: "Системы хозяйственно-питьевого, горячего водоснабжения и водоотведения исправны"
    check: "Горячая и холодная вода в мойках, стоки исправны."
    source:
      doc: "СП 2.3.6.3668-20; СП 2.1.3678-20"
      clause: "п. 3.1, п. 3.4 СП 2.3.6.3668-20; п. 2.2, 2.3 СП 2.1.3678-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 13, 14"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
    period: once
    evidence: check
    severity: high
    fix_days: 7

  - id: rt-shop-uniform
    title: "Работники, контактирующие с продукцией, обеспечены санитарной одеждой; она хранится и стирается отдельно от личной"
    check: "Санодежда выдана и меняется по мере загрязнения; снимается при посещении туалета; отдельный комплект для уборки."
    source:
      doc: "СП 2.3.6.3668-20"
      clause: "п. 11.1, п. 11.3 СП 2.3.6.3668-20"
      checklist: "Приказ № 808, прил. № 1, вопросы 155, 158–161"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
        - { field: staff, gt: 0 }
    period: shift
    evidence: photo
    severity: medium
    fix_days: 1

  - id: rt-shop-medbooks
    title: "У работников с контактом с продукцией — медкнижки с отметками о медосмотрах, гигиенической аттестации и прививках"
    check: "Предварительный медосмотр при приёме, периодические — по графику; отметки об аттестации и прививках не просрочены; не допущенных к работе нет."
    source:
      doc: "СП 2.3.6.3668-20; Федеральный закон от 30.03.1999 № 52-ФЗ; приказ Минздрава от 28.01.2021 № 29н"
      clause: "п. 1.4–1.6 СП 2.3.6.3668-20; ст. 34–36 52-ФЗ"
      checklist: "Приказ № 808, прил. № 1, вопросы 163–167"
      as_of: "2026-09-20"
      verified: true
    applies_if:
      all:
        - { field: activity, in: [shop] }
        - { field: staff, gt: 0 }
    period: year
    evidence: document
    severity: high
    fix_days: 7
