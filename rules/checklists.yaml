# Каталог проверочных листов трёх ведомств: какие листы относятся к заведению.
# Нужен для воронки «сколько листов у ведомств → сколько относится к вам».
#
# Статус листа для профиля:
#   applies_if не выполнен  → не относится, с причиной
#   industry задан          → лист другой отрасли или вида объектов
#   when задан              → относится при условии, которого нет в профиле (показываем как «возможно»);
#                             when_if сужает это: условие действует только для профилей, где when_if выполнен
#   иначе                   → относится
# coverage: full — каждый вопрос листа разобран в справочнике (проверяет тест); partial — разобраны ключевые требования.
#
# Источники: приказ Роспотребнадзора от 24.12.2021 № 808, 6 форм (прил. 1 — торговля, 176 вопросов; прил. 2 — общепит,
# 124 вопроса; прил. 3–6 — спорт, химчистки, парикмахерские, бани); сверено по официальной публикации;
# приказ Роструда от 01.02.2022 № 20 (ред. от 09.12.2024), 80 форм; приказ МЧС России от 09.02.2022 № 78
# (ред. от 24.07.2025), 27 форм. Сверено 26.09.2026. Применимость форм Роструда и МЧС оценена нами по названию
# и области применения формы; условия when владелец проверяет сам.

version: "2026-09-26"
checklists:

  - id: rpn-808-2
    agency: rospotrebnadzor
    number: "прил. 2"
    title: "Предприятия общественного питания"
    doc: "Приказ Роспотребнадзора от 24.12.2021 № 808, приложение № 2"
    questions: 124
    coverage: full
    applies_if: {field: activity, nin: [shop]}
    # Лист не применяется к питанию детей в образовательных, медицинских и социальных организациях (п. 1.2 приказа)
    when_if: {field: activity, in: [canteen_org]}
    when: "если кормите взрослых; питание детей в школах, детсадах и больницах проверяют по другим требованиям"
    other_scopes:
      - {label: "Бортовое питание авиапассажиров", clause: "п. 57 СанПиН 4282-26", questions: "111–124"}
      - {label: "Вагоны-рестораны и купе-буфеты", clause: "п. 39 СанПиН 4282-26", questions: "88"}

