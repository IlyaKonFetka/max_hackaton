# Профиль объекта: поля, варианты ответов и вопросы онбординга.
# Единый источник для бота (вопросы кнопками), движка (предикаты) и мини-приложения (объяснения).
#
# Каждое поле должно влиять хотя бы на одно требование в справочнике — иначе это лишний вопрос.
# value — то, что попадает в профиль и с чем сравниваются предикаты.
# Для диапазонов value — число (репрезентативное значение диапазона), чтобы предикаты gt/lt работали.

version: "2026-09-26"

fields:
  - key: activity
    label: "Вид заведения"
    question: "Какое у вас заведение?"
    type: choice
    options:
      - { value: cafe,       label: "Кафе / ресторан" }
      - { value: coffee,     label: "Кофейня" }
      - { value: canteen,    label: "Столовая" }
      - { value: canteen_org, label: "Столовая в школе, больнице, соцучреждении" }
      - { value: bakery,     label: "Пекарня с залом" }
      - { value: streetfood, label: "Стрит-фуд / киоск" }
      - { value: bar,        label: "Бар" }
      - { value: shop,       label: "Магазин у дома (продукты)" }

  - key: has_kitchen
    label: "Кухня"
    question: "Есть ли собственная кухня — готовите ли блюда или кулинарию на месте?"
    type: bool
    ask_if: {field: activity, nin: [shop]}
    default: false
    options:
      - { value: true,  label: "Да, готовим" }
      - { value: false, label: "Нет, только разогрев или напитки" }
    value_labels: { "true": "есть кухня", "false": "нет кухни" }

  - key: own_production
    label: "Собственное производство"
    question: "Есть ли собственное производство — полуфабрикаты, выпечка, заготовки впрок?"
    type: bool
    ask_if: {field: activity, nin: [shop]}
    default: false
    options:
      - { value: true,  label: "Да" }
      - { value: false, label: "Нет" }
    value_labels: { "true": "есть производство", "false": "нет производства" }

  - key: seats
    label: "Посадочные места"
    question: "Сколько посадочных мест?"
    type: choice
    options:
      - { value: 0,  label: "Нет, только навынос" }
      - { value: 10, label: "1–20" }
      - { value: 35, label: "21–50" }
      - { value: 80, label: "больше 50" }

  - key: staff
    label: "Работники"
    question: "Сколько наёмных работников?"
    type: choice
    options:
      - { value: 0,  label: "Нет, работаю сам" }
      - { value: 3,  label: "1–5" }
      - { value: 10, label: "6–15" }
      - { value: 30, label: "больше 15" }

  - key: alcohol
    label: "Алкоголь"
    question: "Продаёте алкоголь?"
    type: bool
    options:
      - { value: true,  label: "Да" }
      - { value: false, label: "Нет" }
    value_labels: { "true": "есть алкоголь", "false": "нет алкоголя" }

  - key: services
    label: "Что есть в заведении"
    question: "Что из этого у вас есть? Отметьте всё подходящее и нажмите «Готово». Если ничего, сразу «Готово»."
    type: multi
    ask_if: {field: activity, nin: [shop]}
    default: []
    done_label: "Готово"
    options:
      - { value: delivery,       label: "Доставка или еда навынос",       absent: "нет доставки и навынос" }
      - { value: drinks_machine, label: "Кофемашина или торговый автомат", absent: "нет кофемашины и автоматов" }
      - { value: fryer,          label: "Фритюр",                          absent: "нет фритюра" }
      - { value: confectionery,  label: "Кондитерский цех (торты, пирожные с кремом)", absent: "нет кондитерского цеха" }
      - { value: catering,       label: "Кейтеринг, выездное обслуживание", absent: "нет кейтеринга" }
      - { value: grill_outdoor,  label: "Готовим на улице: мангал, гриль", absent: "не готовите на улице" }
      - { value: retail_counter, label: "Продаём свою продукцию через магазин или отдел кулинарии", absent: "не продаёте через магазин" }
      - { value: residential,    label: "Заведение в жилом доме",          absent: "не в жилом доме" }

  - key: region
    label: "Регион"
    question: "В каком регионе заведение? Отправьте точку на карте, напишите регион текстом или пропустите."
    type: text
    optional: true
    skip_label: "Пропустить"
    location: true

  - key: name
    label: "Название"
    question: "Как называется заведение? Это попадёт в акт самопроверки."
    type: text
