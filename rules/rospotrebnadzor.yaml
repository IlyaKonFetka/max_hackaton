  - id: rpn-dishwashing
    title: 'Посуда и приборы моются с дезинфекцией: в посудомоечной машине на максимальном режиме или вручную с дезсредством'
    check: Посуда перед раздачей вымыта и высушена; в конце дня — мойка всей посуды и подносов с дезинфекцией; деформированные подносы не используются.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 37 СанПиН 4282-26; ч. 3 ст. 10, ч. 4 ст. 11 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 84–86
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: seats, gt: 0}
    period: shift
    evidence: check
    severity: medium
    fix_days: 1
  - id: rpn-disinfectants
    title: Моющие и дезинфицирующие средства применяются по инструкции и хранятся отдельно; рабочие растворы промаркированы
    check: Средства с подтверждением соответствия; инструкции доступны; ёмкости с растворами подписаны (название, концентрация, дата приготовления,
      срок годности); хранение исключает попадание в продукцию.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 46, п. 47 СанПиН 4282-26; ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 95–99
      as_of: '2026-09-20'
      verified: true
    period: week
    evidence: photo
    severity: medium
    fix_days: 3
