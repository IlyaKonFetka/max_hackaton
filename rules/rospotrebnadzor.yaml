    check: Салаты, торты, пирожные, холодные напитки не стоят на прилавке без охлаждения; витрина исправна, температура в норме.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 32 СанПиН 4282-26; ч. 12 ст. 17 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопрос 67
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: rpn-dishwashing
