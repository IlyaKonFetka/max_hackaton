  - id: rpn-pest
    title: В помещениях нет насекомых и грызунов; дератизация и дезинсекция не проводятся при посетителях и во время изготовления продукции
    check: Осмотр помещений; действующий договор на дератизацию/дезинсекцию или акты обработок; личные вещи и растения не хранятся в производственных
      помещениях.
    source:
