# Обязательные требования — Роспотребнадзор (санитарно-эпидемиологический надзор, общепит).
#
# Сверено 20.09.2026 по первоисточникам:
#   • СанПиН 2.3/2.4.4282-26 (пост. Главного государственного санитарного врача от 02.06.2026 № 18,
#     рег. Минюста 02.06.2026 № 86854, действует с 01.09.2026 по 01.09.2032) — сквозная нумерация пунктов;
#   • проверочный лист для предприятий общественного питания — приказ Роспотребнадзора от 24.12.2021 № 808,
#     приложение № 2, 124 контрольных вопроса. ВНИМАНИЕ: лист по-прежнему ссылается на пункты СанПиН 2.3/2.4.3590-20,
#     утратившего силу 01.09.2026; ниже для каждого требования даны пункт действующего СанПиН и номер вопроса листа.
#
# Что изменилось в 4282-26 относительно 3590-20 и как это учтено:
#   • журнал бракеража и суточные пробы остались только для питания организованных коллективов
#     (п. 56 — медицина и соцобслуживание, п. 64 — дети) → применимо только к столовым;
#   • отдельного требования об обработке яиц нет → пункт исключён;
#   • ежемесячная генеральная уборка не нормируется → заменена ежедневной влажной уборкой (п. 21);
#   • ежедневная запись температуры холодильников (вопрос 76 листа, п. 3.8 старого СанПиН) в 4282-26
#     прямо не воспроизведена: основание — контрольные термометры (п. 40) и документирование
#     производственного контроля по ХАССП (п. 4).
#
# Поля:
#   applies_if — предикат по профилю (all / any / not / лист {field, eq|ne|in|nin|gt|gte|lt|lte}); отсутствует = применимо всегда
#   period     — once | shift | week | month | halfyear | year
#   evidence   — check | photo | document
#   severity   — high | medium | low
#   fix_days   — срок устранения по умолчанию
#   verified   — реквизиты пункта НПА и номера вопроса проверочного листа сверены с текстом

agency: rospotrebnadzor
agency_label: Роспотребнадзор
order: 1
version: '2026-09-20'
items:
  - id: rpn-notice
    title: Подано уведомление в Роспотребнадзор о начале деятельности по оказанию услуг общественного питания
    check: Уведомление подано до начала работы (через Госуслуги или лично); есть подтверждение о приёме.
    source:
      doc: Федеральный закон от 26.12.2008 № 294-ФЗ; Правила представления уведомлений о начале осуществления отдельных видов предпринимательской
        деятельности
      clause: ст. 8 294-ФЗ; п. 3 Правил
      checklist: Приказ Роспотребнадзора от 24.12.2021 № 808, прил. № 2, вопрос 1
      as_of: '2026-09-20'
      verified: true
    period: once
    evidence: document
    severity: high
    fix_days: 14
  - id: rpn-haccp
    title: 'Ведётся производственный контроль на принципах ХАССП: программа, контрольные точки, документирование'
    check: Есть утверждённая программа производственного контроля; определены контролируемые этапы; результаты контроля документируются на бумаге
      или электронно.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 4 СанПиН 4282-26; ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 2–13
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - any:
            - {field: has_kitchen, eq: true}
            - {field: own_production, eq: true}
    period: once
    evidence: document
    severity: high
    fix_days: 14
  - id: rpn-medbooks
