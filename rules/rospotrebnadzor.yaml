    source:
      doc: СанПиН 2.3/2.4.4282-26; Федеральный закон от 24.06.1998 № 89-ФЗ; СанПиН 2.1.3684-21
      clause: п. 20 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопрос 42
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: check
    severity: medium
    fix_days: 1

