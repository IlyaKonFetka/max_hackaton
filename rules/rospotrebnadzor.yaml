    evidence: photo
    severity: medium
    fix_days: 1
  - id: rpn-shelf-life
    title: Соблюдаются сроки годности и условия хранения; просроченная продукция изъята и утилизирована
    check: 'Выборочно проверить холодильники и склад: сроки, температура, товарное соседство; готовые блюда не реализуются на следующий день и
      не замораживаются.'
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 9, п. 32 СанПиН 4282-26; ст. 5, 18 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 18, 68–70
      as_of: '2026-09-20'
      verified: true
    period: shift
    evidence: check
    severity: high
    fix_days: 1
    applies_if:
      all:
        - {field: activity, nin: [shop]}
  - id: rpn-hot-holding
    title: Готовые блюда находятся на раздаче не более 3 часов; холодные блюда и напитки — в охлаждаемой витрине
    check: Время выставления на раздачу известно; горячее не стоит дольше 3 часов; салаты, десерты, напитки — в холодильной витрине.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 32 СанПиН 4282-26; ч. 12 ст. 17 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 66, 67
