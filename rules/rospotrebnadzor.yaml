    check: "Медкнижка на каждого, кто контактирует с продукцией, посудой, залом; отметки не просрочены."
    source:
      doc: "СанПиН 2.3/2.4.4282-26; приказ Минздрава от 18.02.2022 № 90н"
      clause: "требования к персоналу (уточнить пункт)"
      checklist: "Приказ № 808, прил. № 2, вопрос № — уточнить"
      as_of: "2026-09-01"
      verified: false
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: year
    evidence: document
    severity: high
    fix_days: 7

  - id: rpn-health-journal
    title: "Ежедневно перед сменой ведётся гигиенический журнал (осмотр работников)"
    check: "Запись за сегодня: осмотр на гнойничковые заболевания и признаки ОРВИ, подписи ответственного и работников."
    source:
