        - {field: activity, nin: [shop]}
  - id: rpn-cleaning
    title: Ежедневная влажная уборка производственных помещений с моющими и дезсредствами; уборочный инвентарь промаркирован и хранится отдельно
    check: Уборка за сегодня проведена; столы для посетителей протираются после каждого использования; инвентарь для туалета хранится отдельно
      от остального.
    source:
