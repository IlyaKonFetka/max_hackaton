# Обязательные требования — Роспотребнадзор (санитарно-эпидемиологический надзор, общепит).
#
# ВНИМАНИЕ К ДАННЫМ. Справочник подготовлен вручную по опубликованным НПА и является частичным.
# С 01.09.2026 действует СанПиН 2.3/2.4.4282-26 (пост. Главного государственного санитарного врача
# от 02.06.2026 № 18), заменивший СанПиН 2.3/2.4.3590-20. Нумерация пунктов нового СанПиН
# и номера контрольных вопросов проверочного листа (приказ Роспотребнадзора от 24.12.2021 № 808,
# приложение № 2, в действующей редакции) требуют сверки с текстом — см. поле verified.
#
# Поля:
#   applies_if — предикат по профилю (all / any / not / лист {field, eq|ne|in|gt|gte|lt|lte}); отсутствует = применимо всегда
#   period     — once | shift | week | month | halfyear | year
#   evidence   — check | photo | document
#   severity   — high | medium | low
#   fix_days   — срок устранения по умолчанию

agency: rospotrebnadzor
agency_label: "Роспотребнадзор"
order: 1
version: "2026-09-20"
items:

  - id: rpn-haccp
    title: "Разработаны и внедрены процедуры на основе принципов ХАССП"
    check: "Есть программа производственного контроля и документы ХАССП: перечень критических контрольных точек, журналы мониторинга, ответственные."
    source:
      doc: "СанПиН 2.3/2.4.4282-26"
      clause: "раздел II — общие требования (уточнить пункт)"
      checklist: "Приказ Роспотребнадзора № 808, прил. № 2, вопрос № — уточнить"
      as_of: "2026-09-01"
      verified: false
    applies_if:
      any:
        - { field: has_kitchen, eq: true }
        - { field: own_production, eq: true }
    period: once
    evidence: document
    severity: high
    fix_days: 14

  - id: rpn-medbooks
