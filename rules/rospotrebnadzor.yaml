# Обязательные требования Роспотребнадзора для общественного питания.
#
# Сверено 26.09.2026 по первоисточникам:
#   • СанПиН 2.3/2.4.4282-26 (пост. Главного государственного санитарного врача от 02.06.2026 № 18,
#     рег. Минюста 02.06.2026 № 86854, действует с 01.09.2026 по 01.09.2032), сквозная нумерация пунктов;
#   • проверочный лист для предприятий общественного питания: приказ Роспотребнадзора от 24.12.2021 № 808,
#     приложение № 2, 124 контрольных вопроса. Лист по-прежнему ссылается на пункты СанПиН 2.3/2.4.3590-20,
#     утратившего силу 01.09.2026, поэтому у каждого требования указаны пункт действующего СанПиН и номера вопросов листа.
#
# Лист покрыт полностью: каждый из 124 вопросов относится к одному из требований ниже или к группе
# «для других видов деятельности» в checklists.yaml (бортовое питание, вагоны-рестораны). Это проверяет тест.
#
# Что изменилось в 4282-26 относительно 3590-20 и как это учтено:
#   • журнал бракеража и суточные пробы остались только для питания в медицинских, социальных и детских
#     организациях (п. 56, п. 64): требования применимы только к таким столовым;
#   • термометры на линии раздачи (вопрос 101) остались только для организованных детских коллективов (п. 49);
#   • отдельного требования об обработке яиц нет;
#   • ежемесячная генеральная уборка не нормируется, остаётся ежедневная влажная уборка (п. 21);
#   • ежедневная регистрация температуры в холодильниках и на складах сохранена (п. 35).
#
# Поля:
#   applies_if — предикат по профилю (all / any / not / лист {field, eq|ne|in|nin|gt|gte|lt|lte|has|hasnt});
#                отсутствует = применимо всегда
#   section    — раздел в самопроверке
#   period     — once | shift | week | month | halfyear | year
#   evidence   — check | photo | document
#   severity   — high | medium | low
#   fix_days   — срок устранения по умолчанию
#   verified   — реквизиты пункта НПА и номера вопроса проверочного листа сверены с текстом
#   Номера вопросов движок берёт из строки checklist («вопросы 21, 59, 60», «вопросы 2–13»).

agency: rospotrebnadzor
agency_label: Роспотребнадзор
order: 1
version: '2026-09-26'
domain: "Общественное питание"
items:

  # ── Документы и производственный контроль ──────────────────────────────────

  - id: rpn-notice
    section: Документы и контроль
    title: Подано уведомление в Роспотребнадзор о начале деятельности (общественное питание или розничная торговля)
    check: Уведомление подано до начала работы (через Госуслуги или лично); ждать ответа не нужно, достаточно подтверждения о приёме.
      При смене адреса места деятельности или юрлица новое уведомление не подают, а сообщают об изменениях в течение 10 рабочих дней.
      Для магазина это вопрос 1 проверочного листа розничной торговли (прил. № 1).
    source:
      doc: Федеральный закон от 26.12.2008 № 294-ФЗ; Правила представления уведомлений о начале осуществления отдельных видов
        предпринимательской деятельности
      clause: ст. 8 294-ФЗ; п. 3 Правил
      checklist: Приказ Роспотребнадзора от 24.12.2021 № 808, прил. № 2, вопрос 1
      as_of: '2026-09-26'
      verified: true
    period: once
    evidence: document
    severity: high
    fix_days: 14

  - id: rpn-haccp
    section: Документы и контроль
    title: 'Ведётся производственный контроль на принципах ХАССП: программа, контрольные точки, записи'
    check: Есть утверждённая программа производственного контроля; определены опасные этапы и критические точки (приёмка, хранение,
      тепловая обработка, раздача); результаты контроля записываются на бумаге или электронно. Кофейня без кухни тоже изготавливает
      продукцию (напитки), поэтому программа нужна и ей.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 4 СанПиН 4282-26; ст. 10, 11 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 2–13
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: once
    evidence: document
    severity: high
    fix_days: 14

  - id: rpn-tech-docs
    section: Документы и контроль
    title: Блюда и напитки готовятся по технологическим документам (ТК, ТТК); названия в меню совпадают с документами
    check: На каждую позицию меню есть технологическая или технико-технологическая карта, утверждённая руководителем; карты доступны
      на кухне или за стойкой; название в меню такое же, как в карте.
    source:
      doc: СанПиН 2.3/2.4.4282-26; Федеральный закон от 02.01.2000 № 29-ФЗ
      clause: п. 11 СанПиН 4282-26; п. 1 ст. 17 29-ФЗ
      checklist: Приказ № 808, прил. № 2, вопросы 24, 25
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rpn-allergens
    section: Документы и контроль
    title: Посетитель может узнать об аллергенах и пищевых добавках в блюдах и напитках; дозировка добавок контролируется
    check: В меню, на стойке или по запросу есть сведения об аллергенах (глютен, орехи, молоко, яйца и т. д.) и добавках; добавки
      вносятся по рецептуре и хранятся по инструкции.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 022/2011; ТР ТС 029/2012
      clause: п. 42, п. 43 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопросы 91, 92
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: once
    evidence: photo
    severity: low
    fix_days: 7

  - id: rpn-consumer-info
    section: Документы и контроль
    title: 'Посетителю доступна информация об исполнителе и услугах: вывеска, меню с выходом блюд, контакт для претензий'
    check: Вывеска с наименованием и режимом работы, меню с выходом (весом или объёмом) и ценами, способ направить претензию.
    source:
      doc: Правила оказания услуг общественного питания (пост. Правительства РФ от 21.09.2020 № 1515)
      clause: п. 9–13 Правил (номера пунктов не сверены с текстом)
      checklist: Надзор в сфере защиты прав потребителей, вне листа № 808 (не сверен)
      as_of: '2026-09-01'
      verified: false
    applies_if:
      all:
        - {field: activity, nin: [shop, streetfood]}
        - {field: seats, gt: 0}
    period: once
    evidence: photo
    severity: low
    fix_days: 7

  # ── Персонал ───────────────────────────────────────────────────────────────

  - id: rpn-medbooks
    section: Персонал
    title: Работники прошли гигиеническую подготовку и аттестацию, предварительный и периодические медосмотры, вакцинацию
    check: Личные медицинские книжки на всех, кто контактирует с продукцией и посудой; отметки о медосмотре, аттестации и прививках
      не просрочены. Периодический медосмотр работников общепита проходят раз в год (приказ Минздрава № 29н); сроки гигиенической
      аттестации и прививок в справочнике не указаны, их уточняют в центре гигиены и эпидемиологии, где оформляли книжку.
    source:
      doc: СанПиН 2.3/2.4.4282-26; приказ Минздрава от 28.01.2021 № 29н
      clause: п. 24 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопрос 50
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: staff, gt: 0}
    period: year
    evidence: document
    severity: high
    fix_days: 7

  - id: rpn-health-journal
    section: Персонал
    title: Перед сменой работников осматривают, результаты пишут в гигиенический журнал; больных отстраняют от работы с продуктами
    check: 'Осмотр проводит медработник или назначенное ответственное лицо; запись за сегодня на бумаге или электронно; число отмеченных
      совпадает с числом работников в смене. Отстраняют от работы с продуктами при гнойничковых заболеваниях кожи рук и открытых
      частей тела, кишечных и других инфекционных заболеваниях; обычный порез в п. 25 как основание не назван.'
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: п. 25 СанПиН 4282-26 (образец журнала — приложение № 1 к СанПиН)
      checklist: Приказ № 808, прил. № 2, вопросы 51–54
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: staff, gt: 0}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: rpn-uniform
    section: Персонал
    title: 'Персонал соблюдает личную гигиену: рабочая одежда, личные вещи в шкафах, перчатки при порционировании; посторонние к готовке
      не допускаются'
    check: Личная одежда хранится отдельно от рабочей; рабочую одежду снимают перед туалетом; перчатки при порционировании и приготовлении
      салатов; раковина с мылом в производственной зоне; к приготовлению и раздаче не привлекают тех, у кого это не в обязанностях.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 31, п. 32 СанПиН 4282-26; п. 9 ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 65, 73
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: staff, gt: 0}
    period: shift
    evidence: photo
    severity: medium
    fix_days: 1

  # ── Приёмка, хранение, сроки ───────────────────────────────────────────────

  - id: rpn-intake
    section: Приёмка и хранение
    title: Продукция принимается только с маркировкой и документами; при приёмке проверяют, как её везли
    check: 'На каждую партию: маркировка, товаросопроводительные документы, сведения о подтверждении соответствия; температура в
      машине поставщика соответствует условиям хранения; вскрытые упаковки и свои заготовки подписаны (наименование, дата и время).'
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011; ТР ТС 022/2011
      clause: п. 5, п. 28 СанПиН 4282-26; ст. 5, 17, 21 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 14–16
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: rpn-temp-log
    section: Приёмка и хранение
    title: В холодильниках контрольные термометры, температура записывается ежедневно; ртутных термометров нет
    check: Термометр в каждом холодильнике; запись показаний за сегодня в журнале на бумаге или электронно; на складе есть прибор
      для температуры и влажности; ни одного ртутного термометра.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 35, п. 40, п. 48 СанПиН 4282-26; ч. 4 ст. 11 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 76, 89, 100
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: rpn-shelf-life
    section: Приёмка и хранение
    title: Соблюдаются сроки годности и условия хранения; вчерашние блюда не продаются и не замораживаются; просрочка утилизируется
    check: 'Выборочно проверить холодильники и склад: сроки, температура, товарное соседство; готовые блюда не переходят на следующий
      день и не замораживаются для продажи потом; просроченное изъято и утилизировано.'
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 6, п. 32 СанПиН 4282-26; ст. 5, 7, 18 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 17, 18, 68–70
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: check
    severity: high
    fix_days: 1

  # ── Кухня и приготовление ──────────────────────────────────────────────────

  - id: rpn-flow
    section: Кухня и приготовление
    title: 'Соблюдается поточность: сырьё и готовая продукция не пересекаются; оборудование, столы и инвентарь раздельные и промаркированы'
    check: Планировка без встречных потоков сырья, готовой продукции и грязной посуды; отдельные столы, доски, ножи и холодильники для
      сырья и готового. Исключение — если посадочных мест меньше 25, сырьё и готовое можно хранить в одном холодильнике, но только в
      закрытых контейнерах и гастроёмкостях. Разделочный инвентарь маркируют любым способом, цвет не обязателен.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 8, п. 10, п. 29 СанПиН 4282-26; ст. 10, 14 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 20, 21, 59, 60
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
    period: once
    evidence: photo
    severity: high
    fix_days: 3

  - id: rpn-zones
    section: Кухня и приготовление
    title: Если сырьё обрабатывают и делают полуфабрикаты в одном цехе, зоны и оборудование для них разделены
    check: В цехе выделены отдельные зоны для обработки сырья и для полуфабрикатов, у каждой свои столы и инвентарь.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 30 СанПиН 4282-26; ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопрос 64
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
        - {field: own_production, eq: true}
    period: once
    evidence: photo
    severity: medium
    fix_days: 14

  - id: rpn-semi-finished
    section: Кухня и приготовление
    title: 'Работа только на полуфабрикатах: сырьё не используется, для доготовки есть оборудование, сроки хранения полуфабрикатов
      соблюдаются'
    check: На кухне без цехового деления нет сырого мяса, рыбы, немытых овощей; для доготовки есть нужное оборудование; у полуфабрикатов
      не истёк срок и соблюдается температура хранения.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 8, п. 9 СанПиН 4282-26; ч. 7 ст. 17 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 22, 23
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
        - {field: own_production, eq: false}
    period: once
    evidence: check
    severity: high
    fix_days: 7

  - id: rpn-air
    section: Кухня и приготовление
    title: Воздух в зоне холодных блюд и порционирования обеззараживается бактерицидной установкой
    check: В зонах холодных закусок, салатов, мягкого мороженого, порционирования и упаковки используется бактерицидное оборудование
      (облучатель или рециркулятор) по инструкции по эксплуатации. Отдельный журнал СанПиН не требует, режим задаёт инструкция.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 17 СанПиН 4282-26; ч. 2 ст. 14 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопрос 33
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
    period: once
    evidence: photo
    severity: medium
    fix_days: 14

  - id: rpn-confectionery
    section: Кухня и приготовление
    title: В помещении отделки кондитерских изделий приточная вентиляция с противопыльными и бактерицидными фильтрами
    check: Приточная система в кондитерском цехе оборудована фильтрами; фильтры меняют по графику, отметки есть.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 17 СанПиН 4282-26; ч. 2 ст. 14 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопрос 32
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: confectionery}
    period: once
    evidence: document
    severity: medium
    fix_days: 30

  - id: rpn-fryer
    section: Кухня и приготовление
    title: Фритюрный жир контролируют каждый день, замену записывают, записи хранят три месяца
    check: Запись за сегодня о состоянии фритюра; отметки о замене жира с подписью ответственного; записи за последние три месяца
      на месте.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 44 СанПиН 4282-26; ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопрос 93
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: fryer}
    period: shift
    evidence: document
    severity: medium
    fix_days: 1

  # ── Раздача и посуда ───────────────────────────────────────────────────────

  - id: rpn-hot-holding
    section: Раздача и посуда
    title: Горячие блюда стоят на раздаче не больше 3 часов, температура блюд соответствует технологическим картам
    check: Известно время выставления на раздачу; горячее не стоит дольше 3 часов; температура супов и горячего совпадает с картой.
      Термометр на линии раздачи прямо требуется только детским организациям (п. 49), но проверить температуру по карте без термометра
      нельзя, поэтому на практике он нужен.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 32, п. 50 СанПиН 4282-26; ч. 12 ст. 17 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 66, 102
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
    period: shift
    evidence: check
    severity: high
    fix_days: 1

