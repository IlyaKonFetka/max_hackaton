      checklist: Приказ № 808, прил. № 2, вопросы 19, 71
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: retail_counter}
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rpn-grill-setup
    section: Доставка, выезд, улица
    title: 'Готовка на улице: полуфабрикаты из стационарной кухни, павильон с водой и канализацией, холодильник, условия для гигиены'
    check: Мясо для мангала замариновано и подготовлено в стационарном кафе; павильон подключён к водопроводу и канализации (или
      автономные системы); холодильник для полуфабрикатов; есть где помыть руки; инвентарь моют на оборудованном месте или в кафе.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 36 СанПиН 4282-26; п. 7 ч. 3 ст. 10, ч. 4 ст. 13 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 77, 78, 81–83
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: grill_outdoor}
    period: once
    evidence: photo
    severity: high
    fix_days: 7

  - id: rpn-grill-serving
    section: Доставка, выезд, улица
    title: На уличной точке только одноразовая посуда, жарят непосредственно перед продажей
    check: Нет многоразовых тарелок и приборов; шашлык и гриль жарят под заказ, не держат готовым.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 36 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопросы 79, 80
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: grill_outdoor}
    period: shift
    evidence: check
    severity: medium
    fix_days: 1

  - id: rpn-catering-order
    section: Доставка, выезд, улица
    title: 'Кейтеринг: утверждён внутренний порядок с прослеживаемостью и ответственностью на каждом этапе; посуда по числу порций'
    check: Документ о порядке кейтеринга (кто отвечает за изготовление, перевозку, хранение и раздачу); посуды и приборов комплектуют
      столько, сколько порций, с запасом бокалов и чашек.
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: п. 51, п. 52 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопросы 103, 104
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: catering}
    period: once
    evidence: document
    severity: medium
    fix_days: 14

  - id: rpn-catering-event
    section: Доставка, выезд, улица
    title: 'Кейтеринг: упаковки вскрывают и порционируют в отдельной зоне на месте мероприятия'
    check: На площадке выделено помещение или зона для вскрытия упаковок, порционирования и подготовки к раздаче.
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: п. 53 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопрос 105
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: catering}
    period: once
    evidence: check
    severity: medium
    fix_days: 7

  - id: rpn-catering-transport
    section: Доставка, выезд, улица
    title: 'Кейтеринг: контейнеры собирают не раньше чем за 3 часа, везут в изотермической таре с ярлыками, горячее хранят не больше
      3 часов'
    check: Комплектование начинают не раньше чем за 3 часа до мероприятия; изотермические ёмкости с ярлыком (наименование, изготовитель,
      дата и время, срок годности, условия хранения); ярлыки хранят до конца мероприятия; горячее в термоконтейнерах не дольше 3 часов
      с учётом дороги.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011; ТР ТС 022/2011
      clause: п. 54, п. 55 СанПиН 4282-26; ч. 2, 12 ст. 17 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 106–110
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: services, has: catering}
    period: once
    evidence: photo
    severity: high
    fix_days: 3
