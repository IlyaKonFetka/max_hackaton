    check: Личные медицинские книжки на всех, кто контактирует с продукцией и посудой; отметки о медосмотре, аттестации и прививках не просрочены.
    source:
      doc: СанПиН 2.3/2.4.4282-26; приказ Минздрава от 28.01.2021 № 29н
      clause: п. 24 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопрос 50
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: staff, gt: 0}
    period: year
    evidence: document
    severity: high
    fix_days: 7
  - id: rpn-health-journal
    title: Ежедневно перед сменой проводится осмотр работников; результаты — в гигиеническом журнале
    check: 'Запись за сегодня: осмотр на гнойничковые заболевания и признаки инфекций; список отмеченных совпадает с числом работников в смене.'
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: п. 25 СанПиН 4282-26 (форма журнала — приложение № 1 к СанПиН)
      checklist: Приказ № 808, прил. № 2, вопросы 51–53
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: staff, gt: 0}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1
  - id: rpn-temp-log
    title: Холодильное оборудование оснащено термометрами; температура контролируется и фиксируется ежедневно
    check: Термометр в каждом холодильнике; запись показаний за сегодня в журнале (бумажном или электронном) в рамках производственного контроля.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 40 СанПиН 4282-26 (термометры); п. 4 (документирование производственного контроля); ч. 4 ст. 11 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 76, 89
      as_of: '2026-09-20'
      verified: true
    period: shift
    evidence: photo
    severity: high
    fix_days: 1
    applies_if:
      all:
        - {field: activity, nin: [shop]}
  - id: rpn-brakerazh
    title: Ведётся бракераж готовой продукции с записью в журнале бракеража (питание организованных коллективов)
    check: 'Каждая партия готовых блюд оценена до выдачи; запись: время изготовления, время снятия пробы, наименование, результат, разрешение
      к реализации.'
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: п. 56 (медицинские организации и соцобслуживание), п. 64 (детские организации); формы журнала — приложения № 4, 5 к СанПиН
      checklist: Приказ № 808, прил. № 2 — для общедоступного общепита отдельного вопроса нет
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: activity, in: [canteen]}
        - {field: has_kitchen, eq: true}
    period: shift
    evidence: photo
    severity: high
    fix_days: 1
  - id: rpn-daily-samples
    title: Отбираются и хранятся суточные пробы готовых блюд (питание организованных коллективов)
    check: Пробы каждого блюда за смену в промаркированной обеззараженной посуде, не менее 48 часов при +2…+6 °C; отвечает назначенное лицо.
    source:
      doc: СанПиН 2.3/2.4.4282-26
      clause: подп. 4 п. 56 (медицина, соцобслуживание); п. 64 (дети)
      checklist: Приказ № 808, прил. № 2 — для общедоступного общепита отдельного вопроса нет
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: activity, in: [canteen]}
        - {field: has_kitchen, eq: true}
    period: shift
    evidence: photo
    severity: medium
    fix_days: 1
  - id: rpn-flow
    title: 'Соблюдается поточность: сырьё и готовая продукция не пересекаются; оборудование, столы и инвентарь раздельные и промаркированы'
    check: Отдельные столы, доски, ножи и холодильники для сырья и готового (менее 25 мест — допустим один холодильник при хранении в закрытых
      контейнерах); маркировка на инвентаре; нет встречных потоков.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 10, п. 29 СанПиН 4282-26; ст. 10, 14 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 21, 59, 60
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
    period: once
    evidence: photo
    severity: high
    fix_days: 3
  - id: rpn-labels
    title: Продукция принимается только с маркировкой и товаросопроводительными документами; обеспечена прослеживаемость
    check: На каждую партию — документы и маркировка изготовителя; вскрытые упаковки и собственные заготовки подписаны (наименование, дата и время)
      для прослеживаемости.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011; ТР ТС 022/2011
      clause: п. 5 СанПиН 4282-26; ст. 21 ТР ТС 021/2011; ст. 4 ТР ТС 022/2011
      checklist: Приказ № 808, прил. № 2, вопросы 13, 14
      as_of: '2026-09-20'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - any:
            - {field: has_kitchen, eq: true}
            - {field: own_production, eq: true}
