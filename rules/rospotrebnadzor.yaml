  # ── Уборка, дезинфекция, вредители ─────────────────────────────────────────

  - id: rpn-cleaning
    section: Уборка и дезинфекция
    title: Ежедневная влажная уборка кухни с моющими и дезсредствами; уборочный инвентарь промаркирован и хранится отдельно
    check: Уборка за сегодня проведена; столы для посетителей протираются после каждого гостя; инвентарь для туалета хранится отдельно
      от остального. Ежемесячную генеральную уборку СанПиН 4282-26 больше не нормирует, достаточно ежедневной влажной.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 21, п. 22 СанПиН 4282-26; ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 43–48
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: shift
    evidence: check
    severity: medium
    fix_days: 1

  - id: rpn-disinfectants
    section: Уборка и дезинфекция
    title: Моющие и дезинфицирующие средства применяются по инструкции и хранятся отдельно; рабочие растворы подписаны
    check: 'Средства с подтверждением соответствия, применяются по инструкции и хранятся в специально отведённом месте так, чтобы не
      попасть в продукцию. Если на ёмкости с рабочим раствором нет оригинальной маркировки, её подписывают: название, концентрация,
      дата приготовления, срок годности. Концентрацию контролируют по программе производственного контроля.'
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011
      clause: п. 46, п. 47 СанПиН 4282-26; ч. 3 ст. 10 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 95–99
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: week
    evidence: photo
    severity: medium
    fix_days: 3

  - id: rpn-pest
    section: Уборка и дезинфекция
    title: Нет насекомых и грызунов; дератизацию не проводят во время работы; в заведении никто не живёт, личных вещей в цехах нет
    check: Осмотр помещений; действующий договор на дератизацию и дезинсекцию или акты обработок; обработки не совпадают с изготовлением
      продукции; в цехах нет личных вещей и комнатных растений.
    source:
      doc: СанПиН 2.3/2.4.4282-26; СанПиН 3.3686-21
      clause: п. 26, п. 45 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопросы 55–57, 94
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: month
    evidence: document
    severity: medium
    fix_days: 14

  - id: rpn-waste
    section: Уборка и дезинфекция
    title: Отходы собирают в закрытые ёмкости и вывозят по договору; территория у входа и площадки для мусора в порядке
