    title: Оборудования, инвентаря и посуды хватает на технологический процесс; всё из материалов для контакта с пищей
    check: Холодильников, моечных ванн, плит, инвентаря и посуды хватает на меню и объём; посуда, инвентарь и тара из материалов для
      контакта с пищевой продукцией и выдерживают моющие и дезинфицирующие средства.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011; ТР ТС 005/2011
      clause: п. 12 СанПиН 4282-26; ст. 15 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 26, 27
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: once
    evidence: check
    severity: medium
    fix_days: 30

  - id: rpn-water
    section: Помещения и оборудование
    title: Вода питьевого качества; исправны водоснабжение, горячая вода, канализация, отопление, вентиляция и освещение
    check: Вода из городского водопровода или есть протоколы исследований; горячая вода на всех мойках; стоки не подтекают, нет
      запаха канализации; все лампы горят. Допускаются автономные водонагреватели.
    source:
      doc: СанПиН 2.3/2.4.4282-26; ТР ТС 021/2011; СанПиН 1.2.3685-21
      clause: п. 13, п. 18 СанПиН 4282-26; ст. 10, 12, 14 ТР ТС 021/2011
      checklist: Приказ № 808, прил. № 2, вопросы 28, 34–37, 39
      as_of: '2026-09-26'
      verified: true
    applies_if: {field: activity, nin: [shop]}
    period: once
    evidence: check
    severity: high
    fix_days: 7

  - id: rpn-ventilation
    section: Помещения и оборудование
    title: Над плитами, фритюром и мойками работает местная вытяжка; вентиляция кухни отделена от санузлов и чужих помещений
    check: Зонты и вытяжки над оборудованием, выделяющим тепло, влагу, газы и пыль, исправны; система вентиляции кухни не объединена
      с санузлами и помещениями, не связанными с питанием.
    source:
      doc: СанПиН 2.3/2.4.4282-26; СанПиН 1.2.3685-21
      clause: п. 15, п. 16, п. 18 СанПиН 4282-26
      checklist: Приказ № 808, прил. № 2, вопросы 30, 31, 38
      as_of: '2026-09-26'
      verified: true
    applies_if:
      all:
        - {field: activity, nin: [shop]}
        - {field: has_kitchen, eq: true}
    period: once
    evidence: photo
    severity: medium
    fix_days: 30

