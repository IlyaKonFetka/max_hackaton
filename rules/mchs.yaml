# Обязательные требования МЧС России (пожарный надзор).
# Основание: Правила противопожарного режима в РФ (ППР, пост. Правительства РФ от 16.09.2020 № 1479).
# Проверочный лист: приказ МЧС России от 09.02.2022 № 78 (ред. от 24.07.2025), форма 1 «на объектах всех классов
# функциональной пожарной опасности». Кафе и столовые отдельной формы не имеют, к ним применяется форма 1;
# к магазинам дополнительно форма 5 «организации торговли».
# Пункты ППР и номера вопросов формы 1 сверены 26.09.2026. В справочнике ключевые требования для небольшого
# заведения; остальные вопросы формы 1 (около 180) — переменная часть при расширении справочника.

agency: mchs
agency_label: "МЧС России"
order: 3
version: "2026-09-26"
section: "Пожарная безопасность"
items:

  - id: mchs-extinguishers
    title: "Помещения обеспечены огнетушителями; они исправны, перезаряжены в срок и учтены в журнале"
    check: "Огнетушители на видных местах, пломбы целы, дата перезарядки не просрочена, запись в журнале эксплуатации систем противопожарной защиты."
    source:
      doc: "Правила противопожарного режима в РФ (ПП РФ от 16.09.2020 № 1479)"
      clause: "п. 60, раздел XIX, приложения № 1, 2 ППР"
      checklist: "Приказ МЧС России от 09.02.2022 № 78, форма 1, вопросы 152–154"
      as_of: "2026-09-26"
      verified: true
    period: year
    evidence: photo
    severity: high
    fix_days: 14

  - id: mchs-exits
    title: "Эвакуационные пути и выходы свободны, двери открываются изнутри без ключа, знаки видны"
    check: "Проходы не заставлены мебелью и коробками, в тамбурах нет вешалок и инвентаря, выходы не заперты во время работы, знаки «Выход» видны."
    source:
      doc: "Правила противопожарного режима в РФ (ПП РФ от 16.09.2020 № 1479)"
      clause: "п. 26, п. 27, п. 36 ППР"
      checklist: "Приказ МЧС России от 09.02.2022 № 78, форма 1, вопросы 64, 66–68, 70, 93"
      as_of: "2026-09-26"
      verified: true
    period: shift
    evidence: photo
    severity: high
    fix_days: 1

  - id: mchs-evacuation-plan
    title: "Размещён план эвакуации (в зале 50 и более человек или 10 и более постоянных рабочих мест на этаже)"
    check: "План на видном месте у входа и в зале, соответствует планировке, назначен ответственный. Если на этаже 10 и более постоянных рабочих мест, план нужен и при небольшом зале: в профиле этого вопроса нет, проверьте сами."
    source:
      doc: "Правила противопожарного режима в РФ (ПП РФ от 16.09.2020 № 1479)"
      clause: "п. 5 ППР"
      checklist: "Приказ МЧС России от 09.02.2022 № 78, форма 1, вопрос 7"
      as_of: "2026-09-26"
      verified: true
    applies_if:
      any:
        - { field: seats, gte: 50 }
        - { field: staff, gte: 30 }
    period: once
    evidence: photo
    severity: high
    fix_days: 14

  - id: mchs-briefing
    title: "Работники допущены к работе только после обучения мерам пожарной безопасности; порядок и сроки обучения утверждены"
    check: "Журнал инструктажей с подписями, программа инструктажа, приказ о порядке обучения и об ответственном за пожарную безопасность."
    source:
      doc: "ПП РФ от 16.09.2020 № 1479; приказ МЧС от 18.11.2021 № 806"
      clause: "п. 3 ППР"
      checklist: "Приказ МЧС России от 09.02.2022 № 78, форма 1, вопросы 5, 6"
      as_of: "2026-09-26"
      verified: true
    applies_if:
      all:
        - { field: staff, gt: 0 }
    period: once
    evidence: document
    severity: medium
    fix_days: 14
