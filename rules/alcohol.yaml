# Оборот алкоголя: лицензирование и ограничения продажи.
# Контроль ведут Росалкогольтабакконтроль и уполномоченные органы региона, не Роспотребнадзор,
# поэтому требования вынесены в отдельный файл и отдельное ведомство.
#
# Сверено 26.09.2026 с действующей редакцией ст. 16 Федерального закона от 22.11.1995 № 171-ФЗ.
# Алкогольная продукция — всё крепче 0,5 %, включая пиво, сидр, пуаре и медовуху.
# Для общепита и магазина правила разные: ночной запрет с 23 до 8 (п. 9 ст. 16) на общепит не распространяется.

agency: alcohol
agency_label: Росалкогольтабакконтроль
order: 4
version: '2026-09-26'
section: Алкоголь
items:

  - id: alc-catering
    title: 'Алкоголь в заведении: несовершеннолетним не продаётся; вино и крепкий алкоголь — только организации с лицензией'
    check: Продажа лицам до 18 лет запрещена, это касается и пива, и сидра любой крепости; при сомнении в возрасте продавец вправе
      потребовать документ. ИП в общепите может продавать только пиво, пивные напитки, сидр, пуаре и медовуху, на них лицензия не
      нужна; вино и крепкий алкоголь — только организация с лицензией. Федерального запрета продажи с 23 до 8 часов в общепите нет,
      но регион может ограничить время для заведений в многоквартирных домах, кроме ресторанов, — проверьте закон своего региона.
    source:
      doc: Федеральный закон от 22.11.1995 № 171-ФЗ
      clause: подп. 11 п. 2, п. 9, п. 9.1 ст. 16; ст. 18 171-ФЗ
      checklist: Контроль в сфере оборота алкоголя (Росалкогольтабакконтроль, регион), вне проверочного листа Роспотребнадзора
      as_of: '2026-09-26'
      verified: true
    domain: "Общественное питание"
    applies_if:
      all:
        - {field: alcohol, eq: true}
        - {field: activity, nin: [shop]}
    period: once
    evidence: document
    severity: high
    fix_days: 7

  - id: alc-residential
    title: Заведение в жилом доме продаёт алкоголь только при зале обслуживания от 20 м²
    check: Площадь зала обслуживания по документам (без сезонной веранды) не меньше 20 м². Регион может поднять порог или запретить
      продажу алкоголя в заведениях в многоквартирных домах — проверьте закон своего региона.
    source:
      doc: Федеральный закон от 22.11.1995 № 171-ФЗ
      clause: п. 4.1 ст. 16 171-ФЗ
      checklist: Контроль в сфере оборота алкоголя (Росалкогольтабакконтроль, регион), вне проверочного листа Роспотребнадзора
      as_of: '2026-09-26'
      verified: true
    domain: "Общественное питание"
    applies_if:
      all:
        - {field: alcohol, eq: true}
        - {field: activity, nin: [shop]}
        - {field: services, has: residential}
    period: once
    evidence: document
    severity: high
    fix_days: 30

  - id: alc-shop
    title: 'Алкоголь в магазине: не продаётся несовершеннолетним и с 23 до 8 часов; вино и крепкий алкоголь — только организации с лицензией'
    check: Продажа лицам до 18 лет запрещена, при сомнении продавец вправе потребовать документ. С 23 до 8 часов по местному времени
      алкоголь, включая пиво, не продаётся; регион может расширить запрет. ИП может продавать только пиво, пивные напитки, сидр, пуаре
      и медовуху; вино и крепкий алкоголь — только организация с лицензией.
    source:
      doc: Федеральный закон от 22.11.1995 № 171-ФЗ
      clause: подп. 11 п. 2, п. 9 ст. 16; ст. 18 171-ФЗ
      checklist: Контроль в сфере оборота алкоголя (Росалкогольтабакконтроль, регион), вне проверочного листа Роспотребнадзора
      as_of: '2026-09-26'
      verified: true
    domain: "Магазины"
    applies_if:
      all:
        - {field: alcohol, eq: true}
        - {field: activity, in: [shop]}
    period: shift
    evidence: check
    severity: high
    fix_days: 1
