services:
  app:
    build:
      context: .
      args:
        # Запуск: GIT_COMMIT=$(git rev-parse HEAD) docker compose up -d --build. Без переменной /health покажет unknown
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: applicability-engine:local
    env_file: .env
    environment:
      DATA_DIR: /data
      RULES_DIR: /srv/rules
      STATIC_DIR: /srv/backend/static
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
