components:
  schemas:
    AnswerIn:
      properties:
        status:
          type: string
          pattern: ^(ok|violation|unknown)$
          title: Status
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
      type: object
      required:
      - status
      title: AnswerIn
    AskIn:
      properties:
        question:
          type: string
          maxLength: 1000
          minLength: 2
          title: Question
          examples:
          - Нужен ли мне журнал бракеража?
        rule_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule Id
          description: Если вопрос про конкретный пункт самопроверки
      type: object
      required:
      - question
      title: AskIn
    Body_put_photo_api_session__sessionId__answers__ruleId__photo_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_put_photo_api_session__sessionId__answers__ruleId__photo_post
    Body_task_done_api_tasks__taskId__done_post:
      properties:
        file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: File
      type: object
      title: Body_task_done_api_tasks__taskId__done_post
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProfileIn:
      properties:
        activity:
          type: string
          title: Activity
          description: cafe | coffee | canteen | canteen_org | bakery | streetfood | bar | shop
          examples:
          - cafe
        has_kitchen:
          type: boolean
          title: Has Kitchen
          default: false
          examples:
          - true
        own_production:
          type: boolean
          title: Own Production
          default: false
          examples:
          - true
        seats:
          type: integer
          minimum: 0.0
          title: Seats
          description: Посадочных мест (0 — только навынос)
          examples:
          - 35
        staff:
          type: integer
          minimum: 0.0
          title: Staff
          description: Наёмных работников
          examples:
          - 10
        alcohol:
          type: boolean
          title: Alcohol
          examples:
          - false
        services:
          items:
            type: string
          type: array
          title: Services
          description: 'Что есть в заведении: delivery, drinks_machine, fryer, confectionery, catering, grill_outdoor, retail_counter,
            residential'
          examples:
          - - drinks_machine
            - fryer
        name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Name
          examples:
          - Пекарня на Баумана
        region:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Region
          examples:
          - Республика Татарстан
      type: object
      required:
      - activity
      - seats
      - staff
      - alcohol
      title: ProfileIn
      description: Профиль объекта — те же поля, что задаёт онбординг в боте (rules/profile.yaml).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
servers:
- url: https://185-246-64-221.sslip.io
