openapi: 3.1.0
info:
  title: Движок применимости — API
  version: 0.1.0
  description: 'REST-API сервиса «Движок применимости» (бот + мини-приложение MAX). Публичные методы: /health, /api/rules,
    /api/applicability. Остальные требуют авторизации: в мини-приложении — заголовок X-Max-Init-Data (initData MAX, HMAC-SHA256
    от токена бота); для автоматизированной проверки — заголовок X-Api-Key (или Authorization: Bearer) с тестовым ключом.'
paths:
  /api/me:
    get:
      summary: Me
      operationId: me_api_me_get
      parameters:
      - name: X-Max-Init-Data
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: initData мини-приложения MAX (подписан ботом) — основной способ
          title: X-Max-Init-Data
        description: initData мини-приложения MAX (подписан ботом) — основной способ
      - name: X-Api-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Ключ тестового доступа для автоматизированной проверки
          title: X-Api-Key
        description: Ключ тестового доступа для автоматизированной проверки
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Альтернатива X-Api-Key: `Bearer <ключ>`'
          title: Authorization
        description: 'Альтернатива X-Api-Key: `Bearer <ключ>`'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/session:
