name: Deploy mini app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "first-test/miniapp/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Папка-источник меняется здесь; URL страницы остаётся прежним.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: first-test/miniapp
      - id: deployment
        uses: actions/deploy-pages@v4
